<ion-card button (click)="seleccionar()">
  <div class="cabecera">
    <ion-avatar class="avatar">
      <img [src]="heroe().imagen" [alt]="'Imagen de ' + heroe().nombre" />
    </ion-avatar>

    <ion-card-header>
      <ion-card-title>{{ heroe().nombre }}</ion-card-title>
      <ion-card-subtitle>{{ heroe().universo }}</ion-card-subtitle>
    </ion-card-header>
  </div>

  <ion-card-content>{{ heroe().descripcion }}</ion-card-content>
</ion-card>
